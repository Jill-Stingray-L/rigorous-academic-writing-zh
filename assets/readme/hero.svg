<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">严谨中文科研写作</title>
  <desc id="desc">面向中文科研文本的证据优先审校 Skill，并展示从事实与证据到研究问题、方法、结果和主张的闭环。</desc>

  <rect width="1200" height="420" rx="24" fill="#F4F1E8"/>
